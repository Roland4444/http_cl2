[package]
name = "httpTest"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0               # Уменьшить объем отладочной информации (0 - выкл, 1 - огр., 2 - полная)
incremental = false     # ОТКЛЮЧИТЬ инкрементальную компиляцию!

# Для зависимостей в режиме dev можно вообще отключить отладку
[profile.dev.package."*"]
debug = false

[dependencies]
encoding_rs = "0.8.35"
reqwest = { version = "0.13", features = ["json","form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
bincode = "1.3.1"
axum = "0.8.8"
tower = "0.5.3"
tower-http = "0.6.8"
anyhow = "1.0.101"
chrono = "0.4.43"
once_cell = "1.20"
common = { path = "../common" }
thirtyfour = {version = "0.36.1" }

bytes = "1"
futures = "0.3.32"


futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"
parking_lot = "0.12.5"
base64 = "0.22.1"




